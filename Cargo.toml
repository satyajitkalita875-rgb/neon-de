[workspace]
resolver = "2"
members = [
    "crates/neon-workspaces",
    "crates/neon-window-manager",
    "crates/neon-output",
    "crates/neon-effects",
    "crates/neon-scene",
    "crates/neon-renderer",
    "crates/neon-config",
    "crates/neon-ipc",
    "crates/neon-system",
    "crates/neon-compositor",
    "crates/neon-shell",
    "crates/neon-lockscreen",
    "crates/neon-settings",
    "crates/neon-session",
    "crates/neon-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["NEON DE Contributors"]
repository = "https://github.com/neon-de/neon-de"

[workspace.dependencies]
neon-workspaces = { path = "crates/neon-workspaces" }
neon-window-manager = { path = "crates/neon-window-manager" }
neon-output = { path = "crates/neon-output" }
neon-effects = { path = "crates/neon-effects" }
neon-scene = { path = "crates/neon-scene" }
neon-renderer = { path = "crates/neon-renderer" }
neon-config = { path = "crates/neon-config" }
neon-ipc = { path = "crates/neon-ipc" }
neon-system = { path = "crates/neon-system" }
zbus = "5"
smithay = { version = "0.7.0", default-features = false, features = [
    "backend_drm",
    "backend_egl",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "backend_winit",
    "desktop",
    "renderer_glow",
    "wayland_frontend",
    "xwayland",
    "use_system_lib",
] }
gtk4 = { version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
bitflags = "2"
