[workspace]
resolver = "2"
members = [
    "crates/neon-compositor",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["NEON DE Contributors"]
repository = "https://github.com/neon-de/neon-de"

[workspace.dependencies]
smithay = { version = "0.7.0", default-features = false, features = [
    "backend_winit",
    "desktop",
    "renderer_glow",
    "wayland_frontend",
    "use_system_lib",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
bitflags = "2"
